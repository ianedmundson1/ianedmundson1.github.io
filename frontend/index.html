<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8451f" />
    <meta
      name="description"
      content="Ian Edmundson — Data Scientist & Software Engineer. ML systems, forecasting, and analytics infrastructure for federal operations. NIH Director's Award recipient."
    />
    <link rel="canonical" href="https://ianedmundson.github.io/" />

    <!-- Open Graph / social unfurl defaults (overridden per-route by react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ian Edmundson" />
    <meta property="og:title" content="Ian Edmundson — Data Scientist & Software Engineer" />
    <meta
      property="og:description"
      content="Building ML systems and analytics infrastructure for federal operations. NIH Director's Award recipient."
    />
    <meta property="og:url" content="https://ianedmundson.github.io/" />
    <meta property="og:image" content="https://ianedmundson.github.io/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ian Edmundson — Data Scientist & Software Engineer" />
    <meta
      name="twitter:description"
      content="Building ML systems and analytics infrastructure for federal operations. NIH Director's Award recipient."
    />
    <meta name="twitter:image" content="https://ianedmundson.github.io/og-image.jpg" />

    <title>Ian Edmundson — Data Scientist & Software Engineer</title>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
      // Restore deep-link path stashed by 404.html on GitHub Pages.
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
