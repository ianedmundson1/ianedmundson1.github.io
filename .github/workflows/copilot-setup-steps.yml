# This file configures the environment for the GitHub Copilot Coding Agent.
# The `permissions` block grants the agent's GITHUB_TOKEN the ability to
# create and manage issues, in addition to the default read/write on contents
# and pull-requests that Copilot already has.
#
# See: https://docs.github.com/en/copilot/using-github-copilot/using-copilot-coding-agent/customizing-the-development-environment-for-copilot-coding-agent

name: Copilot Setup Steps

on:
  workflow_dispatch:

permissions:
  # Allow Copilot to create and update issues
  issues: write
  # Retain the defaults Copilot needs to open pull requests
  contents: write
  pull-requests: write

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      # Install Node dependencies so Copilot can build and test the frontend
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install
